# Run tests, coverage, and build docs across all supported platforms
# Triggers on pushes/PRs to main and the active dev branch.
#
# spatialgeometry and swift-sim are installed from GitHub HEAD because the
# current PyPI releases were compiled against NumPy 1.x and crash under 2.x.
# Once numpy-2-compatible releases are published, remove those two steps and
# use plain `pip install .[dev]`.

name: CI

on:
  push:
    branches: [main, future]
  pull_request:
    branches: [main, future]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg
  QT_QPA_PLATFORM: offscreen

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (core, no swift)
        run: pip install .[dev]

      - name: Test (core)
        run: pytest tests/ --ignore=tests/test_blocks.py --timeout=50 --timeout_method=thread -q

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Shorten TEMP path (Windows — avoids MAX_PATH breach during C++ compile)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path C:\T | Out-Null
          "TEMP=C:\T" >> $env:GITHUB_ENV
          "TMP=C:\T"  >> $env:GITHUB_ENV

      - name: Install spatialgeometry + swift from source (NumPy 2 compatible)
        run: |
            pip install "websockets<11"
            pip install git+https://github.com/petercorke/spatialgeometry.git@future
            pip install git+https://github.com/petercorke/swift.git@future

      - name: Install package
        run: pip install .[dev]

      - name: Test
        run: pytest tests/ --ignore=tests/test_blocks.py --timeout=50 --timeout_method=thread -q

  test-pyodide:
    # Runs the test suite for real inside Pyodide (pyodide-build's `pyodide
    # venv`, backed by Node.js -- confirmed via sys.platform == "emscripten"),
    # not just on the assumption that the pure-Python fallback path is
    # correct because desktop coverage passes. This is what actually caught
    # the real bugs logged in tech-debt.md's "Findings from actually
    # running the test suite under real Pyodide" section. Deliberately its
    # own CI-only job, not part of the default local `pytest tests/` run:
    # needs pyodide-build + Node.js, a separate environment from every
    # other job here, and is fundamentally an environment-compatibility
    # check (same category as the os/python-version matrix in the `test`
    # job below), not an everyday correctness check every contributor
    # needs locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Create a Pyodide virtual environment
        run: |
          pip install pyodide-build
          pyodide venv .venv-pyodide

      - name: Install roboticstoolbox and test dependencies into it
        # Not `.[dev]`: several dev extras (coal, swift-sim) have no wasm
        # build and never will -- collision-checking/Swift are correctly
        # unavailable in the browser (see tech-debt.md), not something to
        # chase here. Just the package itself plus what pytest needs.
        #
        # SKBUILD_WHEEL_PLATLIB=false: a plain `pip install .` here doesn't
        # go through cibuildwheel, so it doesn't pick up
        # [tool.cibuildwheel.pyodide]'s environment setting -- the wheel
        # it builds still has zero compiled extensions (CMakeLists.txt's
        # Emscripten check doesn't depend on this var), just the wrong tag
        # without it. Set explicitly here so this job builds and tests the
        # exact same artifact shape that actually gets published.
        env:
          SKBUILD_WHEEL_PLATLIB: "false"
        run: |
          source .venv-pyodide/bin/activate
          pip install .
          pip install pytest pytest-timeout sympy

      - name: Test under real Pyodide
        # No --timeout: pytest-timeout's default signal-based method needs
        # signal.setitimer, unavailable under Pyodide (no real OS signals).
        run: |
          source .venv-pyodide/bin/activate
          pytest tests/ --ignore=tests/test_blocks.py --ignore=tests/test_swift.py -q

  coverage:
    needs: [test-core, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install spatialgeometry + swift from source (NumPy 2 compatible)
        run: |
          pip install "websockets<11"
          pip install git+https://github.com/petercorke/spatialgeometry.git@future
          pip install git+https://github.com/petercorke/swift.git@future

      - name: Install package
        run: pip install .[dev]

      - name: Run coverage
        run: pytest tests/ --ignore=tests/test_blocks.py --cov=src/roboticstoolbox --cov-report=xml:coverage.xml -q

      - uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml

  docs-build:
    needs: [test-core, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install spatialgeometry + swift from source (NumPy 2 compatible)
        run: |
          pip install "websockets<11"
          pip install git+https://github.com/petercorke/spatialgeometry.git@future
          pip install git+https://github.com/petercorke/swift.git@future

      - name: Install docs dependencies
        run: |
          pip install .[docs]
          pip install git+https://github.com/petercorke/sphinx-autorun.git sympy
          sudo apt-get install -y graphviz

      - name: Build docs
        # TODO: add -W once warning count reaches zero
        run: |
          cd docs && make SPHINXOPTS="--keep-going" html
          touch build/html/.nojekyll

      - name: Build pyodide wheel for JupyterLite
        # A genuine pure-Python wheel (py3-none-any), not a wasm
        # cross-compile of the C extensions -- see CMakeLists.txt /
        # pyproject.toml's [tool.cibuildwheel.pyodide]. Built fresh from
        # this checkout rather than fetched from the last GitHub release:
        # cheap now that there's no Emscripten compilation involved (just
        # packaging), so "Try it Now" tracks this branch/PR directly. This
        # also retires the old jupyterlite_pyodide_kernel piplite
        # multiple-wheel-overwrite bug workaround entirely (see
        # tech-debt.md) -- there is only ever one wheel to fetch/build now,
        # and no CPython-version-specific wasm ABI to match, so nothing
        # to pin against.
        #
        # SKBUILD_WHEEL_PLATLIB=false: `pyodide build` invoked directly
        # (not through the cibuildwheel action) doesn't read
        # [tool.cibuildwheel.pyodide]'s environment setting -- that table
        # is cibuildwheel-specific config. Set explicitly here so this
        # produces the same py3-none-any tag release.yml's build_pyodide
        # job does, not a correctly-empty-but-wrongly-tagged wheel.
        env:
          SKBUILD_WHEEL_PLATLIB: "false"
        run: |
          pip install pyodide-build
          mkdir -p docs/lite/pypi
          pyodide build -o docs/lite/pypi

      - name: Sync notebooks into JupyterLite content
        # Copies *.ipynb plus any local asset directories (e.g.
        # docs/notebooks/figs/, referenced by relative path from markdown
        # cells) -- but not the Makefile-generated *.py script conversions
        # or other loose files. ik_benchmark.ipynb is excluded deliberately:
        # it benchmarks numeric IK solver performance and uses the
        # websocket-based Swift visualizer, neither of which is meaningful
        # or functional inside the Pyodide sandbox -- it stays Colab-only.
        run: |
          mkdir -p docs/lite/files
          rsync -a --exclude '.ipynb_checkpoints' --exclude '__pycache__' \
            --exclude 'Untitled*.ipynb' --exclude '*.py' --exclude 'Makefile' \
            --exclude 'ik_benchmark.ipynb' \
            docs/notebooks/ docs/lite/files/

      - name: Adapt staged notebooks for JupyterLite
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("docs/lite/files")
          for nb_path in root.rglob("*.ipynb"):
              with nb_path.open("r", encoding="utf-8") as f:
                  nb = json.load(f)

              meta = nb.setdefault("metadata", {})
              meta["kernelspec"] = {
                  "name": "python",
                  "display_name": "Python (Pyodide)",
                  "language": "python",
              }
              meta.setdefault("language_info", {})
              meta["language_info"]["name"] = "python"

              with nb_path.open("w", encoding="utf-8") as f:
                  json.dump(nb, f, indent=1)
                  f.write("\n")
          PY

      - name: Build JupyterLite site
        # jupyterlite-pyodide-kernel no longer needs pinning: the old
        # version-skew hazard (a compiled wasm wheel's ABI tied to one
        # specific Pyodide runtime, silently hanging if the kernel bundled
        # a newer/older one) doesn't apply to a pure-Python wheel -- it
        # has no ABI to match at all. See toolbox-infrastructure.md for
        # the historical version-skew story.
        run: |
          pip install jupyterlite-core jupyterlite-pyodide-kernel jupyter-server
          cd docs/lite && jupyter lite build --output-dir ../build/html/lite

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  # Separate job so the github-pages environment (and its deployment
  # protection rules restricting it to main) is only ever touched on main —
  # a job-level `environment:` triggers a deployment attempt as soon as the
  # job starts, regardless of any step-level `if:`, so PR/dependabot runs
  # would otherwise show a false "failed to deploy to github-pages".
  docs-deploy:
    needs: docs-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
