# Run tests, coverage, and build docs across all supported platforms
# Triggers on pushes/PRs to main and the active dev branch.
#
# spatialgeometry and swift-sim are installed from GitHub HEAD because the
# current PyPI releases were compiled against NumPy 1.x and crash under 2.x.
# Once numpy-2-compatible releases are published, remove those two steps and
# use plain `pip install .[dev]`.

name: CI

on:
  push:
    branches: [main, future]
  pull_request:
    branches: [main, future]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg
  QT_QPA_PLATFORM: offscreen

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (core, no swift)
        run: pip install .[dev]

      # Model tests (Panda, PR2, UR3/5/10, Jaco, ...) load URDFs via the
      # robot_descriptions package, which does NOT bundle the actual asset
      # data — on first use of a given model it lazily `git clone`s a large
      # upstream asset repo (hundreds of files) straight into this cache dir.
      # On a fresh runner that clone happens mid-test, competing with our
      # own --timeout=50 per test, so it's slow and occasionally flaky.
      # Caching the directory between runs means only the very first run
      # after this step lands pays that cost; every run after restores
      # instantly. Bump the "v1" suffix below to force a clean re-fetch if
      # the cache ever ends up corrupted or stale.
      - name: Cache robot_descriptions assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/robot_descriptions
          key: robot-descriptions-v1-${{ runner.os }}

      - name: Test (core)
        run: pytest tests/ --ignore=tests/test_blocks.py --timeout=50 --timeout_method=thread -q

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Shorten TEMP path (Windows — avoids MAX_PATH breach during C++ compile)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path C:\T | Out-Null
          "TEMP=C:\T" >> $env:GITHUB_ENV
          "TMP=C:\T"  >> $env:GITHUB_ENV

      - name: Install spatialgeometry + swift from source (NumPy 2 compatible)
        run: |
            pip install "websockets<11"
            pip install git+https://github.com/petercorke/spatialgeometry.git@future
            pip install git+https://github.com/petercorke/swift.git@future

      - name: Install package
        run: pip install .[dev]

      # See the "Cache robot_descriptions assets" step in test-core above —
      # same reasoning, this job hits the same lazily-cloned model data.
      - name: Cache robot_descriptions assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/robot_descriptions
          key: robot-descriptions-v1-${{ runner.os }}

      - name: Test
        run: pytest tests/ --ignore=tests/test_blocks.py --timeout=50 --timeout_method=thread -q

  coverage:
    needs: [test-core, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install spatialgeometry + swift from source (NumPy 2 compatible)
        run: |
          pip install "websockets<11"
          pip install git+https://github.com/petercorke/spatialgeometry.git@future
          pip install git+https://github.com/petercorke/swift.git@future

      - name: Install package
        run: pip install .[dev]

      # See the "Cache robot_descriptions assets" step in test-core above —
      # same reasoning, this job hits the same lazily-cloned model data.
      - name: Cache robot_descriptions assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/robot_descriptions
          key: robot-descriptions-v1-${{ runner.os }}

      - name: Run coverage
        run: pytest tests/ --ignore=tests/test_blocks.py --cov=src/roboticstoolbox --cov-report=xml:coverage.xml -q

      - uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml

  docs-build:
    needs: [test-core, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install spatialgeometry + swift from source (NumPy 2 compatible)
        run: |
          pip install "websockets<11"
          pip install git+https://github.com/petercorke/spatialgeometry.git@future
          pip install git+https://github.com/petercorke/swift.git@future

      - name: Install docs dependencies
        run: |
          pip install .[docs]
          pip install git+https://github.com/petercorke/sphinx-autorun.git sympy
          sudo apt-get install -y graphviz

      - name: Build docs
        # TODO: add -W once warning count reaches zero
        run: |
          cd docs && make SPHINXOPTS="--keep-going" html
          touch build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  # Separate job so the github-pages environment (and its deployment
  # protection rules restricting it to main) is only ever touched on main —
  # a job-level `environment:` triggers a deployment attempt as soon as the
  # job starts, regardless of any step-level `if:`, so PR/dependabot runs
  # would otherwise show a false "failed to deploy to github-pages".
  docs-deploy:
    needs: docs-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
