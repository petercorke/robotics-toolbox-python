# Build wheels for all platforms and publish to PyPI.
# Triggered on GitHub release creation or manually via workflow_dispatch.
#
# Uses OIDC trusted publishing — no stored PyPI token required.
# macOS uses macos-14 (arm64); cibuildwheel cross-compiles x86_64 as well
# (see [tool.cibuildwheel.macos] archs in pyproject.toml).
# Check for latest cibuildwheel: https://github.com/pypa/cibuildwheel/releases

name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify_version:
    name: Verify tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version
        # Skip check on manual workflow_dispatch runs (no release tag exists)
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag version : $TAG"
          echo "Package version: $PKG"
          [ "$TAG" = "$PKG" ] || { echo "ERROR: tag v$TAG does not match pyproject.toml version $PKG"; exit 1; }

  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }})
    needs: verify_version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_pyodide:
    name: Build Pyodide (wasm32) wheel
    needs: verify_version
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Diagnostics
        run: |
          python3 --version
          pip3 --version
          pip3 show cibuildwheel 2>/dev/null || echo "cibuildwheel not installed locally (normal)"

      - name: Build Pyodide wheel
        # Forced to cp312 deliberately -- Pyodide only ships JSPI-default-on
        # (WebAssembly "stack switching") starting at 0.27.7, and Pyodide's
        # cp313 support only starts at 0.28.0a1, i.e. *after* JSPI became the
        # default. There is no JSPI-safe cp313 (or later) Pyodide build.
        # Safari has no JSPI support; Firefox only behind a flag. Without
        # this override, cibuildwheel 4.1.1's own default silently targets
        # cp313 instead of cp312 -- exactly what broke this job once already
        # (2026-08-23). See pyproject.toml's [tool.cibuildwheel.pyodide]
        # comment and the toolbox-maintainer skill's JupyterLite
        # version-pinning section for the full story before changing this.
        #
        # CIBW_ENABLE: pyodide-eol is required too -- cibuildwheel 4.1.1
        # considers cp312/0.27.x "end of life" now that cp313/0.29.x is its
        # new default, and refuses to build it at all without this explicit
        # opt-in (confirmed directly: omitting it fails outright with
        # "Invalid build selector: 'cp312-pyodide_wasm32'. This selector
        # matches a group that wasn't enabled").
        uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: cp312-pyodide_wasm32
          CIBW_ENABLE: pyodide-eol

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: wheels-pyodide
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: verify_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  smoke_test:
    name: Smoke-test Linux wheel
    needs: build_wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-ubuntu-latest-*
          merge-multiple: true
          path: wheelhouse

      - name: Install wheel (pulls all deps from PyPI)
        run: pip install --find-links wheelhouse roboticstoolbox-python

      - name: Smoke test
        run: python -c "import roboticstoolbox; print('OK', roboticstoolbox.__version__)"

  upload_pypi:
    needs: [build_wheels, build_pyodide, build_sdist, smoke_test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      # Exclude the Pyodide wheel -- PyPI rejects the old, pre-standard
      # `pyodide_*` platform tag this cp312 build produces. Deliberately
      # staying on this tag (not the newer PEP-783 `pyemscripten_*` one) to
      # keep the wasm build JSPI-safe for Safari/Firefox -- see the
      # `build_pyodide` job's comment and the toolbox-maintainer skill's
      # JupyterLite version-pinning section. It's attached as a GitHub
      # Release asset in the next job instead.
      - name: Remove Pyodide wheels from PyPI upload set
        run: rm -f dist/*pyodide*.whl

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  upload_pyodide_asset:
    name: Attach Pyodide wheel to GitHub release
    needs: build_pyodide
    if: github.event_name == 'release' && needs.build_pyodide.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-pyodide
          path: pyodide-dist

      - name: Upload Pyodide wheel as release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: pyodide-dist/*.whl
