name: Feature request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >-
        What would the RTB function/method look like? Include its
        signature — parameter names and types, and the return
        value(s) and type(s).
      placeholder: |
        def new_method(self, threshold: float, mode: Literal["a", "b"] = "a") -> NDArray:
            ...
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >-
        Any existing RTB function that's close, a workaround you're
        currently using, or another API shape you considered and why
        it didn't fit. Leave blank if none.
      placeholder: |
        e.g. "Currently chaining robot.fkine(...) then manual transform
        composition — works but takes 3 extra steps."
    validations:
      required: false
