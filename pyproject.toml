[project]

name = "roboticstoolbox-python"

description = "A Python library for robotics education and research"

version = "1.4.0"

authors = [
    { name = "Jesse Haviland", email = "j.haviland@qut.edu.au" },
    { name = "Peter Corke", email = "rvc@petercorke.com" },
]

dependencies = [
    "numpy",
    "spatialmath-python>=1.1.16",
    "spatialgeometry>=1.4.0",
    "pgraph-python",
    "scipy",
    "matplotlib",
    "ansitable",
    "rtb-data>=2.0",
    "progress",
    "typing_extensions",
    "colored>2.0.0",
    "xacrodoc",
    "robot_descriptions>=2.0,<3.0",
]

license = { file = "LICENSE" }

readme = "README.md"

requires-python = ">=3.10"

keywords = [
    "python",
    "robotics",
    "robotics-toolbox",
    "kinematics",
    "dynamics",
    "motion-planning",
    "trajectory-generation",
    "jacobian",
    "hessian",
    "control",
    "simulation",
    "robot-manipulator",
    "mobile-robot",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    # Indicate who your project is intended for
    "Intended Audience :: Developers",
    # Pick your license as you wish (should match "license" above)
    "License :: OSI Approved :: MIT License",
    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]


[project.urls]
homepage = "https://petercorke.github.io/robotics-toolbox-python/"
documentation = "https://petercorke.github.io/robotics-toolbox-python/"
repository = "https://github.com/petercorke/robotics-toolbox-python"


[project.optional-dependencies]

swift = ["swift-sim>=2.0.0", "websockets"]

collision = ["coal; sys_platform != 'win32'", "trimesh"]

qp = ["qpsolvers", "quadprog"]

tool = ["ipython", "pygments"]

all = [
    "swift-sim>=2.0.0",
    "websockets",
    "qpsolvers",
    "quadprog",
    "coal; sys_platform != 'win32'",
    "trimesh",
    "ipython",
    "pygments",
]

dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pyyaml",
    "sympy",
    "qpsolvers",
    "quadprog",
    "bdsim",
    "ruff",
    "coal; sys_platform != 'win32'",
    "trimesh",
    "nbmake",
]

# Backward-compatible alias; notebook tooling is included in "dev".
nb = ["nbmake"]

docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "sphinx-pyrunblock",
    "sphinx_autodoc_typehints",
    "sphinx-favicon",
    "sphinxcontrib-bibtex",
    "sphinx-copybutton",
    "sphinx-codeautolink",
]


[project.scripts]

eigdemo = "roboticstoolbox.demo.eigdemo:main"
tripleangledemo = "roboticstoolbox.demo.tripleangledemo:main"
twistdemo = "roboticstoolbox.demo.twistdemo:main"
rtbtool = "roboticstoolbox.bin.rtbtool:main"


[build-system]

requires = ["scikit-build-core>=0.9", "numpy", "nanobind>=2"]
build-backend = "scikit_build_core.build"


[tool.scikit-build]
wheel.packages = ["src/roboticstoolbox"]
sdist.include = [
    "src/roboticstoolbox",
    "tests",
    "CMakeLists.txt",
    "README.md",
    "LICENSE",
]
sdist.exclude = ["rtb-data/**"]


[tool.ruff]
line-length = 88
exclude = [".git", "build", "dist", "docs", ".venv", ".tox"]

[tool.ruff.lint]
ignore = ["F821", "E741", "E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.cibuildwheel]

build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*"]
skip = ["*musllinux*"]

[tool.cibuildwheel.macos]
archs = ["auto"] # arm64 only from macos-latest; x86_64 EOL

[tool.cibuildwheel.linux]
archs = [
    "auto",
] # native arch only; arm64 uses ubuntu-24.04-arm runner (no QEMU)

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.pyodide]
# Pyodide (wasm32-emscripten) — used by JupyterLite
# cibuildwheel manages the Emscripten SDK; scikit-build-core picks up
# the toolchain file automatically from the PYODIDE environment.
#
# Deliberately NO explicit `pyodide-version` override here -- the
# `build_pyodide` job in release.yml is pinned to cibuildwheel 3.4.1
# specifically (not the 4.1.1 used for native wheels) so it self-resolves
# its own default (cp312/Pyodide 0.27.7), matching spatialgeometry's own
# config exactly. An explicit `pyodide-version = "0.27.7"` override was
# tried and failed here: cibuildwheel 3.4.1's bundled pyodide-build
# (0.33.0) rejected it outright as "not compatible" even though it's
# that same tool's own documented default -- the override and the tool's
# internal default-resolution logic aren't equivalent, and only the
# latter actually works. Don't add one back without testing against a
# real build first.
#
# Why cp312/0.27.x specifically: Pyodide only ships cp313+ support from
# 0.28.0a1 onward, by which point WebAssembly JSPI ("stack switching")
# was already on by default (since 0.27.7) -- and Safari has no JSPI
# support, Firefox only behind a flag. cp312/0.27.x is the newest
# JSPI-safe line. jupyterlite-pyodide-kernel's pin in ci.yml must match
# (jupyterlite-pyodide-kernel==0.6.1, bundling Pyodide 0.27.6) -- see
# that file's "Fetch pyodide wheel for JupyterLite" step, and the
# toolbox-maintainer skill's JupyterLite version-pinning section for the
# full JSPI/Safari story before changing any of this.


[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:FigureCanvasAgg is non-interactive:UserWarning",
]

[tool.coverage.run]
omit = ["src/roboticstoolbox/demo/*", "test_*.py"]
